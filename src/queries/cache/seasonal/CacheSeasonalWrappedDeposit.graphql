query CacheSeasonalWrappedDeposit($where: String!, $orderBy: String!, $orderDirection: String!) {
  cache_wrappedDepositERC20HourlySnapshots(
    where: $where
    orderBy: $orderBy
    orderDirection: $orderDirection
  ) {
    id
    season
    supply
    redeemRate
    apy24h
    apy7d
    apy30d
    apy90d
    createdAt
  }
}

