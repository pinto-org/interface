query CacheSeasonalBean($where: String!, $orderBy: String!, $orderDirection: String!) {
  cache_beanHourlySnapshots(
    where: $where
    orderBy: $orderBy
    orderDirection: $orderDirection
  ) {
    id
    seasonNumber
    supply
    marketCap
    instPrice
    l2sr
    liquidityUSD
    twaPrice
    twaDeltaB
    instDeltaB
    crosses
    supplyInPegLP
    createdTimestamp
  }
}
