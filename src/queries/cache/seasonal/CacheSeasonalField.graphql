query CacheSeasonalField($where: String!, $orderBy: String!, $orderDirection: String!) {
  cache_fieldHourlySnapshots(
    where: $where
    orderBy: $orderBy
    orderDirection: $orderDirection
  ) {
    id
    season
    caseId
    issuedSoil
    deltaSownBeans
    sownBeans
    deltaPodDemand
    blocksToSoldOutSoil
    podRate
    temperature
    deltaTemperature
    cultivationTemperature
    harvestableIndex
    harvestablePods
    harvestedPods
    numberOfSowers
    numberOfSows
    podIndex
    realRateOfReturn
    seasonBlock
    soil
    soilSoldOut
    unharvestablePods
    createdAt
  }
}
