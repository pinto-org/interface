query CacheFarmerSeasonalSiloAsset($where: String!, $orderBy: String!, $orderDirection: String!) {
  cache_siloAssetHourlySnapshots(
    where: $where
    orderBy: $orderBy
    orderDirection: $orderDirection
  ) {
    id
    season
    depositedAmount
    depositedBDV
    deltaDepositedBDV
    deltaDepositedAmount
    createdAt
  }
}

