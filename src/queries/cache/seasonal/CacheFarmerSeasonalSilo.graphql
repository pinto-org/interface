query CacheFarmerSeasonalSilo($where: String!, $orderBy: String!, $orderDirection: String!) {
  cache_siloHourlySnapshots(
    where: $where
    orderBy: $orderBy
    orderDirection: $orderDirection
  ) {
    id
    season
    createdAt
    plantedBeans
    stalk
    germinatingStalk
    depositedBDV
  }
}

