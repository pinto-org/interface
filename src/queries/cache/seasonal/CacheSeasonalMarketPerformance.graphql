query CacheSeasonalMarketPerformance($where: String!, $orderBy: String!, $orderDirection: String!) {
  cache_marketPerformanceSeasonals(
    where: $where
    orderBy: $orderBy
    orderDirection: $orderDirection
  ) {
    id
    season
    timestamp
    thisSeasonTokenUsdPrices
    usdChange
    percentChange
    totalUsdChange
    totalPercentChange
    cumulativeUsdChange
    cumulativePercentChange
    cumulativeTotalUsdChange
    cumulativeTotalPercentChange
  }
}

