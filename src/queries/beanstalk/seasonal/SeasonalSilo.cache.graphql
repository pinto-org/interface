query BeanstalkSeasonalSilo($where: String, $orderBy: String, $orderDirection: String) {
  siloHourlySnapshots: cache_siloHourlySnapshots(
    where: $where
    orderBy: $orderBy
    orderDirection: $orderDirection
  ) {
    id
    season
    stalk
    grownStalkPerSeason
    depositedBDV
    createdAt
  }
}
