query BeanstalkSeasonalField($where: String, $orderBy: String, $orderDirection: String) {
  fieldHourlySnapshots: cache_fieldHourlySnapshots(
    where: $where
    orderBy: $orderBy
    orderDirection: $orderDirection
  ) {
    id
    season
    podRate
    temperature
    podIndex
    harvestableIndex
    sownBeans
    harvestedPods
    issuedSoil
    deltaSownBeans
    createdAt
  }
}
