query ReferralLeaderboard($first: Int!, $skip: Int!, $block: Block_height) {
  farmers(
    first: $first
    skip: $skip
    orderBy: totalReferralRewardPodsReceived
    orderDirection: desc
    where: { totalReferralRewardPodsReceived_gt: "0" }
    block: $block
  ) {
    id
    refereeCount
    totalReferralRewardPodsReceived
  }
}
