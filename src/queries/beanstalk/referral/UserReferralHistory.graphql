query UserReferralHistory($referrer: Bytes!, $first: Int!) {
  referralSows(
    where: { referrer: $referrer }
    first: $first
    orderBy: blockNumber
    orderDirection: desc
  ) {
    id
    referrer
    referrerIndex
    referrerPods
    referee
    refereeIndex
    refereePods
    blockNumber
    transactionHash
    createdAt
  }
}
