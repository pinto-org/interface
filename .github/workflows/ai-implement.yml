name: AI Issue Implementation

on:
  issues:
    types: [labeled]

jobs:
  check-permissions:
    if: github.event.label.name == 'ai-implement'
    runs-on: ubuntu-latest
    outputs:
      has-write-permission: ${{ steps.check.outputs.has-write-permission }}
    steps:
      - name: Check user permissions
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor
            });

            const hasWritePermission = ['admin', 'maintain', 'write'].includes(permission.permission);
            console.log(`User ${context.actor} has permission: ${permission.permission}`);
            console.log(`Has write permission: ${hasWritePermission}`);

            core.setOutput('has-write-permission', hasWritePermission);

  implement:
    needs: check-permissions
    if: needs.check-permissions.outputs.has-write-permission == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Create feature branch
        run: |
          BRANCH_NAME="ai/issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Run Claude Code to implement changes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --print "
          Implement the following GitHub issue:

          Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

          ${{ github.event.issue.body }}

          Instructions:
          1. Read CLAUDE.md to understand project patterns
          2. Find relevant files and make the necessary changes
          3. Keep changes minimal and focused
          4. Follow existing patterns (React, TypeScript, Tailwind, Radix UI)
          5. Run 'yarn format' before finishing

          You MUST make file changes. If unclear, use your best judgment.
          "

      - name: Format code
        run: yarn format || true

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          else
            git commit -m "feat: implement issue #${{ github.event.issue.number }}

          ${{ github.event.issue.title }}

          🤖 Generated with Claude Code"
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          fi

      - name: Push branch
        if: env.HAS_CHANGES == 'true'
        run: git push origin "$BRANCH_NAME"

      - name: Create Pull Request
        if: env.HAS_CHANGES == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "AI: ${{ github.event.issue.title }}" \
            --body "## Automated Implementation

          This PR implements the changes requested in #${{ github.event.issue.number }}

          ### Review Checklist
          - [ ] Changes match what was requested
          - [ ] No unintended modifications
          - [ ] Code looks correct
          - [ ] Types are properly defined
          - [ ] Follows project patterns

          ---
          🤖 *Generated with Claude Code*" \
            --base main \
            --head "$BRANCH_NAME"

      - name: Comment on issue (success)
        if: env.HAS_CHANGES == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr view "$BRANCH_NAME" --json url -q .url)
          gh issue comment ${{ github.event.issue.number }} \
            --body "✅ I've created a PR to implement this request: $PR_URL

          Please review the changes!"

      - name: Comment on issue (no changes)
        if: env.HAS_CHANGES == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "⚠️ I analyzed this request but couldn't determine what changes to make.

          **Possible reasons:**
          - The request may be too vague
          - The files to modify couldn't be identified
          - The changes may require more context

          **To help me:**
          - Specify which file(s) to modify
          - Provide more detail about the expected behavior
          - Include code examples if possible"
